<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>R² Holdings</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  :root {
    --bg: #0a0e1a;
    --bg-raised: #10162a;
    --bg-hover: #161d35;
    --border: #232b47;
    --gold: #c9a961;
    --gold-bright: #e8cd8a;
    --text: #eef1f6;
    --text-dim: #8b93a7;
    --good: #4ade80;
    --bad: #f87171;
  }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% -10%, #131b33 0%, #0a0e1a 55%, #060811 100%);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    padding-bottom: 80px;
    min-height: 100vh;
  }
  .serif { font-family: 'Playfair Display', serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
  .muted { color: var(--text-dim); }
  .good { color: var(--good); }
  .bad { color: var(--bad); }

  .khead { position: sticky; top: 0; z-index: 40; background: rgba(10,14,26,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
  .khead-row { max-width: 560px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
  .wordmark { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 18px; letter-spacing: 0.3px; color: var(--gold-bright); display: flex; align-items: center; gap: 8px; }
  .day-badge { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; font-weight: 600; color: var(--text-dim); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  #authScreen { padding-top: 12vh; }
  .auth-hero { text-align: center; margin-bottom: 28px; }
  .auth-hero .wordmark { font-size: 30px; justify-content: center; margin-bottom: 8px; }
  .auth-hero .tag { color: var(--text-dim); font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase; }
  .card-panel {
    background: linear-gradient(160deg, var(--bg-raised), #0c1122);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 16px;
  }
  .auth-tabs { display: flex; gap: 6px; margin-bottom: 18px; background: var(--bg); border-radius: 10px; padding: 4px; border: 1px solid var(--border); }
  .auth-tab { flex: 1; padding: 10px; border-radius: 7px; border: none; background: transparent; color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; letter-spacing: 0.3px; }
  .auth-tab.active { background: linear-gradient(135deg, var(--gold), #a5813f); color: #1a1406; }
  input, select, textarea {
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 9px;
    padding: 12px 13px; font-family: 'Inter', sans-serif; font-size: 13px; width: 100%; min-width: 0;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  .field-label { font-size: 10px; color: var(--text-dim); margin: 12px 0 5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .btn {
    cursor: pointer; background: linear-gradient(135deg, var(--gold), #a5813f); color: #1a1406;
    border: none; border-radius: 10px; padding: 13px 18px; font-family: 'Inter', sans-serif;
    font-weight: 700; font-size: 13.5px; width: 100%; letter-spacing: 0.2px;
  }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn.outline-gold { background: transparent; color: var(--gold-bright); border: 1px solid var(--gold); }
  .btn.bad { background: linear-gradient(135deg, #f87171, #c1484d); color: #fff; }
  .btn.small { padding: 9px 14px; font-size: 12px; width: auto; }
  .btn-row { display: flex; gap: 8px; }
  .err-text { font-size: 11.5px; color: var(--bad); margin-top: 8px; min-height: 14px; }

  /* the card itself */
  .bankcard {
    position: relative;
    background: linear-gradient(135deg, #172046 0%, #0d1229 60%, #0a0e1e 100%);
    border: 1px solid #2c3560;
    border-radius: 18px;
    padding: 22px 22px 20px;
    aspect-ratio: 1.586;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .bankcard::before {
    content: ''; position: absolute; top: -60%; right: -30%; width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(201,169,97,0.18), transparent 70%);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; z-index: 1; }
  .card-brand { font-family: 'Playfair Display', serif; font-weight: 800; font-size: 15px; color: var(--gold-bright); }
  .card-tier { font-size: 8.5px; color: var(--text-dim); letter-spacing: 1.5px; margin-top: 2px; }
  .chip { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #e8cd8a, #a5813f); position: relative; }
  .chip::after { content: ''; position: absolute; inset: 5px; border: 1px solid rgba(0,0,0,0.25); border-radius: 3px; }
  .card-number { font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 3px; color: #f1f0ec; z-index: 1; }
  .card-bottom { display: flex; justify-content: space-between; align-items: flex-end; z-index: 1; }
  .card-holder-label { font-size: 7.5px; color: var(--text-dim); letter-spacing: 1px; }
  .card-holder-name { font-size: 12.5px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .card-valid { text-align: right; }

  .balance-block { text-align: center; padding: 6px 0 18px; }
  .balance-label { font-size: 10.5px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .balance-num { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 40px; color: var(--gold-bright); }

  .section-title { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 800; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; padding: 18px 0 8px; }

  .req-type-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
  .req-type-toggle button { flex: 1; padding: 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text-dim); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .req-type-toggle button.active.deposit { background: rgba(74,222,128,0.12); border-color: var(--good); color: var(--good); }
  .req-type-toggle button.active.withdraw { background: rgba(248,113,113,0.12); border-color: var(--bad); color: var(--bad); }

  .txn-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .txn-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-raised); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .txn-info { flex: 1; min-width: 0; }
  .txn-title { font-weight: 700; font-size: 12.5px; }
  .txn-sub { font-size: 10px; color: var(--text-dim); margin-top: 1px; }
  .txn-amt { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; text-align: right; }
  .status-pill { font-size: 8.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; letter-spacing: 0.4px; text-transform: uppercase; display: inline-block; margin-top: 3px; }
  .status-pill.pending { background: rgba(201,169,97,0.15); color: var(--gold-bright); border: 1px solid rgba(201,169,97,0.4); }
  .status-pill.approved { background: rgba(74,222,128,0.12); color: var(--good); border: 1px solid rgba(74,222,128,0.35); }
  .status-pill.denied { background: rgba(248,113,113,0.12); color: var(--bad); border: 1px solid rgba(248,113,113,0.35); }

  .approve-row { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .approve-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .approve-user { font-weight: 800; font-size: 13px; }
  .approve-note { font-size: 11.5px; color: var(--text-dim); margin: 4px 0 10px; font-style: italic; }

  .approver-row { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .approver-badge { font-size: 8.5px; font-weight: 800; padding: 2px 8px; border-radius: 20px; background: rgba(201,169,97,0.15); color: var(--gold-bright); border: 1px solid rgba(201,169,97,0.4); margin-left: 6px; }

  .empty-note { font-size: 12px; color: var(--text-dim); padding: 22px 4px; text-align: center; }
  .toast { position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%); background: var(--bg-raised); border: 1px solid var(--gold); color: var(--text); padding: 10px 18px; border-radius: 20px; font-size: 12px; z-index: 999; display: none; box-shadow: 0 6px 18px rgba(0,0,0,0.5); }

  .knav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(9,12,22,0.94); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; z-index: 60; max-width: 560px; margin: 0 auto; }
  .knav-item { flex: 1; text-align: center; padding: 11px 0 calc(11px + env(safe-area-inset-bottom)); background: none; border: none; color: var(--text-dim); font-family: 'Inter', sans-serif; cursor: pointer; }
  .knav-item.active { color: var(--gold-bright); }
  .knav-icon { font-size: 18px; display: block; }
  .knav-label { font-size: 8.5px; font-weight: 700; margin-top: 2px; display: block; letter-spacing: 0.4px; }
</style>
</head>
<body>

<div id="authScreen" class="wrap">
  <div class="auth-hero">
    <div class="wordmark serif">R² HOLDINGS</div>
    <div class="tag">private banking for the realm</div>
  </div>

  <div class="card-panel">
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLoginBtn">log in</button>
      <button class="auth-tab" id="tabSignupBtn">open an account</button>
    </div>

    <input id="authUser" placeholder="username" style="margin-bottom:10px;" />
    <input id="authPass" type="password" placeholder="password" style="margin-bottom:10px;" />

    <button class="btn" id="authSubmitBtn">log in</button>
    <div class="err-text" id="authError"></div>
  </div>
</div>

<div id="bankScreen" style="display:none;">
  <div class="khead">
    <div class="khead-row">
      <div class="wordmark serif">R² HOLDINGS</div>
      <span class="day-badge mono" id="dayBadge">DAY 1</span>
    </div>
  </div>

  <div class="wrap" style="padding-top:18px;">

    <div class="tab-pane active" id="tab-account">
      <div class="bankcard">
        <div class="card-top">
          <div>
            <div class="card-brand">R² Holdings</div>
            <div class="card-tier">MEMBER SINCE DAY <span id="cardJoined"></span></div>
          </div>
          <div class="chip"></div>
        </div>
        <div class="card-number mono" id="cardNumber"></div>
        <div class="card-bottom">
          <div>
            <div class="card-holder-label">CARD HOLDER</div>
            <div class="card-holder-name" id="cardHolder"></div>
          </div>
          <div class="card-valid">
            <div class="card-holder-label">STATUS</div>
            <div class="card-holder-name" id="cardStatus">ACTIVE</div>
          </div>
        </div>
      </div>

      <div class="balance-block">
        <div class="balance-label">available balance</div>
        <div class="balance-num mono" id="balanceNum">0.00.I</div>
      </div>

      <div class="card-panel">
        <div class="req-type-toggle">
          <button class="deposit active" data-type="deposit">⬆ deposit</button>
          <button class="withdraw" data-type="withdraw">⬇ withdraw</button>
        </div>
        <div class="field-label">amount (.I)</div>
        <input id="reqAmount" type="number" min="0" step="0.01" placeholder="0.00" style="margin-bottom:10px;" />
        <div class="field-label">note (optional)</div>
        <input id="reqNote" placeholder="what's this for?" style="margin-bottom:14px;" />
        <button class="btn" id="submitReqBtn">request approval</button>
        <div style="font-size:10.5px;color:var(--text-dim);margin-top:10px;text-align:center;">every deposit and withdrawal needs sign-off from an approver</div>
      </div>

      <div class="section-title">your activity</div>
      <div id="myTxns"></div>
    </div>

    <div class="tab-pane" id="tab-approve">
      <div class="section-title">pending approvals</div>
      <div id="pendingList"></div>

      <div class="section-title">manage approvers</div>
      <div id="approverList"></div>
    </div>

  </div>
</div>

<div class="knav" id="bankNav" style="display:none;">
  <button class="knav-item active" data-tab="account"><span class="knav-icon">💳</span><span class="knav-label">ACCOUNT</span></button>
  <button class="knav-item" data-tab="approve" id="approveNavBtn" style="display:none;"><span class="knav-icon">🖋️</span><span class="knav-label">APPROVALS</span></button>
  <button class="knav-item" id="logoutNavBtn"><span class="knav-icon">🚪</span><span class="knav-label">LOG OUT</span></button>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWEpdrAtqzbaTPOXmtIilkebDAHDk8oOE",
  authDomain: "eskm-99a6f.firebaseapp.com",
  databaseURL: "https://eskm-99a6f-default-rtdb.firebaseio.com",

  messagingSenderId: "142104615575",

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

<script>
function fmt(n, d = 2) { return Number(n).toFixed(d); }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function simpleHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function generateCardNumber() {
  const groups = [];
  for (let i = 0; i < 4; i++) {
    let n = '';
    for (let j = 0; j < 4; j++) n += Math.floor(Math.random() * 10);
    groups.push(n);
  }
  return groups.join(' ');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => { t.style.display = 'none'; }, 2600);
}

let marketDay = 1;
let currentUser = null;
let myProfile = null;
let usersCache = {};
let requests = [];
let selectedReqType = 'deposit';

// day badge, purely cosmetic — reads the same server day used everywhere else
db.ref('market/day').on('value', (snap) => {
  marketDay = snap.val() || 1;
  const badge = document.getElementById('dayBadge');
  if (badge) badge.textContent = 'DAY ' + marketDay;
});

// ---------- users ----------
db.ref('bank/users').on('value', (snap) => {
  usersCache = snap.val() || {};
  if (currentUser) myProfile = usersCache[currentUser] || myProfile;
  renderCard();
  renderMyTxns();
  renderPendingList();
  renderApproverList();
});

// ---------- requests ----------
db.ref('bank/requests').orderByChild('ts').limitToLast(300).on('value', (snap) => {
  const list = [];
  snap.forEach(child => list.push({ id: child.key, ...child.val() }));
  list.reverse();
  requests = list;
  renderMyTxns();
  renderPendingList();
});

// ---------- auth ----------
let authMode = 'login';
function setAuthMode(mode) {
  authMode = mode;
  document.getElementById('tabLoginBtn').classList.toggle('active', mode === 'login');
  document.getElementById('tabSignupBtn').classList.toggle('active', mode === 'signup');
  document.getElementById('authSubmitBtn').textContent = mode === 'signup' ? 'open account' : 'log in';
  document.getElementById('authError').textContent = '';
}

async function handleAuthSubmit() {
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  const uname = document.getElementById('authUser').value.trim();
  const pass = document.getElementById('authPass').value;
  if (!uname || !pass) { errEl.textContent = 'fill in a username and password.'; return; }
  const unameLower = uname.toLowerCase();

  if (authMode === 'signup') {
    const existingSnap = await db.ref('bank/users/' + unameLower).once('value');
    if (existingSnap.exists()) { errEl.textContent = 'that username already has an account — log in instead.'; return; }
    const allSnap = await db.ref('bank/users').once('value');
    const isFirstEver = !allSnap.exists();
    const profile = {
      username: uname, passHash: simpleHash(pass),
      cardNumber: generateCardNumber(), balance: 0,
      isApprover: isFirstEver, joinedDay: marketDay
    };
    await db.ref('bank/users/' + unameLower).set(profile);
    loginAs(unameLower, profile);
    if (isFirstEver) showToast('welcome — you\u2019re the founding approver');
  } else {
    const snap = await db.ref('bank/users/' + unameLower).once('value');
    if (!snap.exists()) { errEl.textContent = 'no account with that username — open one instead.'; return; }
    const profile = snap.val();
    if (profile.passHash !== simpleHash(pass)) { errEl.textContent = 'wrong password.'; return; }
    loginAs(unameLower, profile);
  }
}

function loginAs(unameLower, profile) {
  currentUser = unameLower;
  myProfile = profile;
  usersCache[unameLower] = profile;
  localStorage.setItem('bankUser', unameLower);
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('bankScreen').style.display = 'block';
  document.getElementById('bankNav').style.display = 'flex';
  document.getElementById('approveNavBtn').style.display = profile.isApprover ? 'block' : 'none';
  renderCard();
  renderMyTxns();
  renderPendingList();
  renderApproverList();
}

function logout() {
  localStorage.removeItem('bankUser');
  currentUser = null; myProfile = null;
  document.getElementById('bankScreen').style.display = 'none';
  document.getElementById('bankNav').style.display = 'none';
  document.getElementById('authScreen').style.display = 'block';
  document.getElementById('authUser').value = '';
  document.getElementById('authPass').value = '';
  switchTab('account');
}

async function restoreSession() {
  const saved = localStorage.getItem('bankUser');
  if (!saved) return;
  const snap = await db.ref('bank/users/' + saved).once('value');
  if (snap.exists()) loginAs(saved, snap.val());
  else localStorage.removeItem('bankUser');
}

// ---------- card + balance ----------
function renderCard() {
  if (!currentUser || !myProfile) return;
  document.getElementById('cardJoined').textContent = myProfile.joinedDay || 1;
  document.getElementById('cardNumber').textContent = myProfile.cardNumber || '\u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022';
  document.getElementById('cardHolder').textContent = myProfile.username;
  document.getElementById('balanceNum').textContent = fmt(myProfile.balance || 0) + '.I';
  document.getElementById('approveNavBtn').style.display = myProfile.isApprover ? 'block' : 'none';
}

// ---------- request form ----------
document.querySelectorAll('.req-type-toggle button').forEach(btn => {
  btn.onclick = () => {
    selectedReqType = btn.dataset.type;
    document.querySelectorAll('.req-type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});

async function submitRequest() {
  const amount = parseFloat(document.getElementById('reqAmount').value);
  const note = document.getElementById('reqNote').value.trim().slice(0, 120);
  if (!amount || amount <= 0) { showToast('enter a valid amount'); return; }
  if (!currentUser) return;
  await db.ref('bank/requests').push({
    user: currentUser, type: selectedReqType, amount, note,
    status: 'pending', day: marketDay, ts: Date.now()
  });
  document.getElementById('reqAmount').value = '';
  document.getElementById('reqNote').value = '';
  showToast('request sent for approval');
}

// ---------- approvals ----------
async function approveRequest(id) {
  const req = requests.find(r => r.id === id);
  if (!req || req.status !== 'pending') return;
  if (req.user === currentUser) { showToast("you can't approve your own request — needs another approver"); return; }

  const claimed = await db.ref('bank/requests/' + id + '/status').transaction(cur => {
    if (cur !== 'pending') return; // someone else already handled it
    return 'processing';
  });
  if (!claimed.committed || claimed.snapshot.val() !== 'processing') { showToast('already handled'); return; }

  const delta = req.type === 'deposit' ? req.amount : -req.amount;
  const result = await db.ref('bank/users/' + req.user + '/balance').transaction(bal => {
    const current = bal || 0;
    const next = current + delta;
    if (next < 0) return; // abort — insufficient funds
    return next;
  });

  if (!result.committed) {
    await db.ref('bank/requests/' + id + '/status').set('denied');
    await db.ref('bank/requests/' + id + '/reason').set('insufficient balance at time of approval');
    showToast('denied — insufficient balance');
    return;
  }

  await db.ref('bank/requests/' + id).update({ status: 'approved', approvedBy: currentUser, approvedTs: Date.now() });
  showToast('approved');
}

async function denyRequest(id) {
  const req = requests.find(r => r.id === id);
  if (!req || req.status !== 'pending') return;
  if (req.user === currentUser) { showToast("you can't act on your own request — needs another approver"); return; }
  const claimed = await db.ref('bank/requests/' + id + '/status').transaction(cur => cur === 'pending' ? 'denied' : undefined);
  if (claimed.committed) {
    await db.ref('bank/requests/' + id).update({ deniedBy: currentUser, deniedTs: Date.now() });
    showToast('denied');
  } else {
    showToast('already handled');
  }
}

async function toggleApprover(unameLower) {
  const target = usersCache[unameLower];
  if (!target) return;
  await db.ref('bank/users/' + unameLower + '/isApprover').set(!target.isApprover);
  showToast((!target.isApprover ? 'granted' : 'revoked') + ' approver rights for ' + target.username);
}

// ---------- render lists ----------
function renderMyTxns() {
  const el = document.getElementById('myTxns');
  if (!el || !currentUser) return;
  const mine = requests.filter(r => r.user === currentUser);
  if (!mine.length) { el.innerHTML = '<div class="empty-note">no activity yet — request a deposit or withdrawal above</div>'; return; }
  el.innerHTML = mine.map(r => {
    const isDeposit = r.type === 'deposit';
    const sign = isDeposit ? '+' : '\u2212';
    const color = r.status === 'denied' ? 'muted' : (isDeposit ? 'good' : 'bad');
    return `
      <div class="txn-row">
        <div class="txn-icon">${isDeposit ? '⬆' : '⬇'}</div>
        <div class="txn-info">
          <div class="txn-title">${isDeposit ? 'Deposit' : 'Withdrawal'} request</div>
          <div class="txn-sub">${r.note ? escapeHtml(r.note) + ' \u00b7 ' : ''}Day ${r.day}</div>
          <span class="status-pill ${r.status}">${r.status}</span>
        </div>
        <div class="txn-amt ${color}">${sign}${fmt(r.amount)}.I</div>
      </div>
    `;
  }).join('');
}

function renderPendingList() {
  const el = document.getElementById('pendingList');
  if (!el) return;
  if (!myProfile || !myProfile.isApprover) { el.innerHTML = ''; return; }
  const pending = requests.filter(r => r.status === 'pending');
  if (!pending.length) { el.innerHTML = '<div class="empty-note">nothing waiting on you</div>'; return; }
  el.innerHTML = pending.map(r => {
    const isDeposit = r.type === 'deposit';
    const isMine = r.user === currentUser;
    return `
      <div class="approve-row">
        <div class="approve-head">
          <span class="approve-user">${escapeHtml(r.user)} \u2014 <span class="${isDeposit ? 'good' : 'bad'}">${isDeposit ? '+' : '\u2212'}${fmt(r.amount)}.I</span></span>
          <span class="muted mono" style="font-size:10px;">Day ${r.day}</span>
        </div>
        ${r.note ? `<div class="approve-note">"${escapeHtml(r.note)}"</div>` : ''}
        ${isMine
          ? `<div class="muted" style="font-size:11px;">this is yours \u2014 waiting on another approver</div>`
          : `<div class="btn-row">
              <button class="btn small" onclick="approveRequest('${r.id}')">approve</button>
              <button class="btn ghost small" onclick="denyRequest('${r.id}')">deny</button>
            </div>`}
      </div>
    `;
  }).join('');
}

function renderApproverList() {
  const el = document.getElementById('approverList');
  if (!el) return;
  if (!myProfile || !myProfile.isApprover) { el.innerHTML = ''; return; }
  const entries = Object.entries(usersCache);
  if (!entries.length) { el.innerHTML = '<div class="empty-note">no accounts yet</div>'; return; }
  el.innerHTML = entries.map(([uname, u]) => `
    <div class="approver-row">
      <div>
        ${escapeHtml(u.username)}
        ${u.isApprover ? '<span class="approver-badge">APPROVER</span>' : ''}
      </div>
      <button class="btn ${u.isApprover ? 'ghost' : 'outline-gold'} small" onclick="toggleApprover('${uname}')">${u.isApprover ? 'revoke' : 'grant'}</button>
    </div>
  `).join('');
}

// ---------- tabs ----------
function switchTab(name) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  document.querySelectorAll('.knav-item[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
}
document.querySelectorAll('.knav-item[data-tab]').forEach(b => { b.onclick = () => switchTab(b.dataset.tab); });

// ---------- wiring ----------
document.getElementById('tabLoginBtn').onclick = () => setAuthMode('login');
document.getElementById('tabSignupBtn').onclick = () => setAuthMode('signup');
document.getElementById('authSubmitBtn').onclick = handleAuthSubmit;
document.getElementById('submitReqBtn').onclick = submitRequest;
document.getElementById('logoutNavBtn').onclick = logout;

restoreSession();

</script>
</body>
</html>
