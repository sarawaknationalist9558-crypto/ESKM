<script>
const PALETTE = ["#4ee0a0","#ffd76e","#ff8ac2","#6ec7ff","#ff9a5a","#ffd700","#c084fc","#ff7a7a","#7ad7f0","#e0e066"];
const ICONS = ["🪙","💎","🚀","🔥","🐸","🎲","🥇","🌙","⚡","👑","🍀","🦄","🐳","🎯","💰"];

function iconFor(key, name) {
  const map = { Emerald: "🟢", Kuku: "🐤", Vally: "🌸", MtPrime: "⛰️", Jacq: "🎲", Tungtung: "🥇" };
  if (map[key]) return map[key];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % ICONS.length;
  return ICONS[Math.abs(hash) % ICONS.length];
}
function fmt(n, d = 2) { return Number(n).toFixed(d); }
function fmtCompact(n) {
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return fmt(n,0);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => { t.style.display = 'none'; }, 2400);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function migrate(s) {
  s.online = typeof s.online === 'boolean' ? s.online : true;
  s.day = s.day || 1;
  s.coins = (Array.isArray(s.coins) ? s.coins : []).map(c => ({
    key: c.key, name: c.name,
    color: c.color || PALETTE[Math.floor(Math.random()*PALETTE.length)],
    icon: c.icon || iconFor(c.key, c.name),
    price: c.price,
    supply: c.supply || 0,
    dayOpen: c.dayOpen !== undefined ? c.dayOpen : c.price,
    dayHigh: c.dayHigh !== undefined ? c.dayHigh : c.price,
    dayLow: c.dayLow !== undefined ? c.dayLow : c.price,
    ath: c.ath !== undefined ? c.ath : c.price,
    atl: c.atl !== undefined ? c.atl : c.price,
    rugged: c.rugged || false,
    delisted: c.delisted || false,
    daysSinceRug: c.daysSinceRug || 0,
  }));
  s.history = Array.isArray(s.history) ? s.history : [];
  s.traders = (Array.isArray(s.traders) ? s.traders : []).map(t => ({
    name: t.name, positions: t.positions || {}, realizedProfit: t.realizedProfit || 0, totalCashedOut: t.totalCashedOut || 0
  }));
  s.news = Array.isArray(s.news) ? s.news : [];
  return s;
}

let state = { online: true, day: 0, coins: [], history: [], traders: [] };
let expandedCoin = null;
let lineChartInstance = null;

function prevPrice(key) {
  const h = state.history;
  return h.length > 1 ? h[h.length-2][key] : undefined;
}
function pctChange(coin) {
  const prev = prevPrice(coin.key);
  if (prev === undefined || !prev) return 0;
  return ((coin.price - prev) / prev) * 100;
}
function drawSparkline(canvas, key, color) {
  const series = state.history.slice(-10).map(d => d[key]).filter(v => v !== undefined);
  if (series.length < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const W = 52, H = 24;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const hi = Math.max(...series), lo = Math.min(...series), range = (hi-lo)||1;
  ctx.beginPath();
  ctx.strokeStyle = color; ctx.lineWidth = 1.6;
  series.forEach((v,i) => {
    const x = (i/(series.length-1)) * (W-2) + 1;
    const y = H - 2 - ((v-lo)/range) * (H-4);
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
function drawLineChart(coinKey, canvasId, innerId, scrollId, autoScrollToEnd) {
  const inner = document.getElementById(innerId);
  const scrollEl = document.getElementById(scrollId);
  const visibleW = scrollEl.getBoundingClientRect().width;
  const neededW = Math.max(state.history.length * 26 + 30, visibleW);
  inner.style.width = neededW + 'px';
  const coin = state.coins.find(c => c.key === coinKey);
  const ctx = document.getElementById(canvasId).getContext('2d');
  if (lineChartInstance) lineChartInstance.destroy();
  lineChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: state.history.map(d => 'D'+d.day),
      datasets: [{
        data: state.history.map(d => d[coinKey] !== undefined ? d[coinKey] : null),
        borderColor: coin.color, backgroundColor: coin.color, borderWidth: 2, pointRadius: 2, tension: 0.3, spanGaps: true,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#0c0a14', borderColor:'#3a2f5c', borderWidth:1 } },
      scales: {
        x: { ticks: { color: '#8d84a8', font: { size: 9 } }, grid: { color: '#241c3c' } },
        y: { ticks: { color: '#8d84a8', font: { size: 10 } }, grid: { color: '#241c3c' } },
      }
    }
  });
  if (autoScrollToEnd) scrollEl.scrollLeft = scrollEl.scrollWidth;
}

function getTraderRows() {
  return state.traders.map(t => {
    let currentValue = 0, costBasis = 0;
    const posDetails = [];
    Object.entries(t.positions).forEach(([key, pos]) => {
      const coin = state.coins.find(c => c.key === key);
      if (!coin) return;
      const val = pos.units * coin.price;
      currentValue += val; costBasis += pos.cost;
      posDetails.push({ key, coinName: coin.name, icon: coin.icon, color: coin.color, units: pos.units, cost: pos.cost, value: val, pl: val - pos.cost });
    });
    const unrealized = currentValue - costBasis;
    const totalProfit = unrealized + t.realizedProfit;
    return { ...t, currentValue, costBasis, unrealized, totalProfit, hasOpen: posDetails.length > 0, posDetails };
  });
}

function renderTicker() {
  const items = state.coins.filter(c => !c.delisted).map(c => {
    const chg = pctChange(c);
    const up = chg >= 0;
    return `<span class="ticker-item">${c.rugged ? '💀' : c.icon} ${c.name} <span class="${up?'up':'down'}">${up?'▲':'▼'} ${fmt(Math.abs(chg),1)}%</span></span>`;
  }).join('');
  document.getElementById('tickerTrack').innerHTML = items + items;
}

function renderCoinList() {
  const el = document.getElementById('coinList');
  el.innerHTML = '';
  if (!state.coins.length) { el.innerHTML = '<div class="empty-note">no coins listed yet</div>'; return; }
  const sorted = [...state.coins].sort((a, b) => {
    if (a.rugged !== b.rugged) return a.rugged ? 1 : -1;
    const af = isFavorite(a.key), bf = isFavorite(b.key);
    if (af !== bf) return af ? -1 : 1;
    return 0;
  });
  sorted.forEach(c => {
    const chg = pctChange(c);
    const up = chg >= 0;
    const mcap = c.price * c.supply;
    const row = document.createElement('div');
    row.className = 'coin-row';
    if (c.rugged) row.style.opacity = c.delisted ? '0.25' : String(Math.max(0.35, 1 - (c.daysSinceRug || 0) * 0.15));
    const badge = c.delisted ? ' <span style="color:#6e6690;font-size:9px;font-weight:800;">💀 DELISTED</span>' : c.rugged ? ' <span style="color:#ff6e8e;font-size:9px;font-weight:800;">💀 RUGGED</span>' : '';
    const favMark = isFavorite(c.key) ? '❤️ ' : '';
    row.innerHTML = `
      <div class="coin-icon" style="background:${c.color}22;border:1px solid ${c.color}55;">${c.icon}</div>
      <div class="coin-info">
        <div class="coin-name">${favMark}${c.name}${badge}</div>
        <div class="coin-mcap">mcap ${fmtCompact(mcap)}.I · supply ${fmtCompact(c.supply)}</div>
      </div>
      <canvas class="coin-spark" id="spark-${c.key}"></canvas>
      <div class="coin-price-col">
        <div class="coin-price">${fmt(c.price)}.I</div>
        <div class="coin-chg ${up?'up':'down'}">${up?'+':''}${fmt(chg,1)}%</div>
      </div>
    `;
    row.onclick = () => openAssetPage(c.key);
    el.appendChild(row);
    requestAnimationFrame(() => { const cv = document.getElementById(`spark-${c.key}`); if (cv) drawSparkline(cv, c.key, c.color); });
  });
}

// ---------- favorites (per-device, local only) ----------
function getFavorites() { try { return JSON.parse(localStorage.getItem('eskimoFavorites') || '[]'); } catch (e) { return []; } }
function isFavorite(key) { return getFavorites().includes(key); }
function toggleFavorite(key) {
  let favs = getFavorites();
  favs = favs.includes(key) ? favs.filter(k => k !== key) : [...favs, key];
  localStorage.setItem('eskimoFavorites', JSON.stringify(favs));
  const btn = document.getElementById('assetFavBtn');
  btn.textContent = favs.includes(key) ? '❤️' : '🤍';
  btn.classList.toggle('active', favs.includes(key));
  renderCoinList();
}

// ---------- asset detail page (phantom-style) ----------
let currentAssetCoin = null;
let currentTimeframe = 'live';
let assetChartInstance = null;
let chatMsgRef = null, chatPresenceRef = null, myPresenceRef = null;
let chatGuestId = localStorage.getItem('eskimoGuestId');
if (!chatGuestId) { chatGuestId = 'g' + Math.random().toString(36).slice(2, 10); localStorage.setItem('eskimoGuestId', chatGuestId); }

function getChatNickname() {
  let name = localStorage.getItem('eskimoChatName');
  if (!name) {
    name = (prompt("pick a name for chat (everyone will see it):", "Guest") || 'Guest').trim().slice(0, 20) || 'Guest';
    localStorage.setItem('eskimoChatName', name);
  }
  return name;
}

function openAssetPage(key) {
  currentAssetCoin = key;
  currentTimeframe = 'live';
  document.querySelectorAll('#tfPills .tf-pill').forEach(p => p.classList.toggle('active', p.dataset.tf === 'live'));
  document.getElementById('assetOverlay').style.display = 'block';
  renderAssetPage();
  attachChat(key);
}
function closeAssetPage() {
  if (currentAssetCoin) detachChat();
  currentAssetCoin = null;
  document.getElementById('assetOverlay').style.display = 'none';
}

function renderAssetPage() {
  const c = state.coins.find(x => x.key === currentAssetCoin);
  if (!c) { closeAssetPage(); return; }
  const chg = pctChange(c);
  const up = chg >= 0;
  const prev = prevPrice(c.key);
  const deltaAbs = prev !== undefined ? c.price - prev : 0;
  document.getElementById('assetIconRing').textContent = c.icon;
  document.getElementById('assetIconRing').style.borderColor = c.color;
  document.getElementById('assetIconRing').style.background = c.color + '22';
  document.getElementById('assetName').textContent = c.name;
  document.getElementById('assetTicker').textContent = c.key.toUpperCase();
  document.getElementById('assetPrice').textContent = fmt(c.price) + '.I';
  document.getElementById('assetDelta').innerHTML = `<span class="${up ? 'up' : 'down'}">${up ? '+' : ''}${fmt(deltaAbs)}.I (${up ? '+' : ''}${fmt(chg, 2)}%)</span>`;
  document.getElementById('assetMcap').textContent = `${fmtCompact(c.price * c.supply)}.I market cap`;
  document.getElementById('assetStatBadge').innerHTML = c.delisted ? '<span style="color:#6e6690;">💀 DELISTED</span>' : c.rugged ? '<span style="color:#ff6e8e;">💀 RUGGED</span>' : '';
  const favBtn = document.getElementById('assetFavBtn');
  favBtn.textContent = isFavorite(c.key) ? '❤️' : '🤍';
  favBtn.classList.toggle('active', isFavorite(c.key));
  renderAssetChart();
}

function renderAssetChart() {
  const c = state.coins.find(x => x.key === currentAssetCoin);
  if (!c) return;
  let hist = state.history;
  if (currentTimeframe === 'live') hist = hist.slice(-10);
  else if (currentTimeframe === '1w') hist = hist.slice(-7);
  else if (currentTimeframe === '1m') hist = hist.slice(-30);
  const scrollEl = document.getElementById('assetChartScroll');
  const inner = document.getElementById('assetChartBox');
  const visibleW = scrollEl.getBoundingClientRect().width;
  const neededW = Math.max(hist.length * 30 + 30, visibleW);
  inner.style.width = neededW + 'px';
  const ctx = document.getElementById('assetChartCanvas').getContext('2d');
  if (assetChartInstance) assetChartInstance.destroy();
  assetChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: hist.map(d => 'D' + d.day),
      datasets: [{
        data: hist.map(d => d[c.key] !== undefined ? d[c.key] : null),
        borderColor: c.color, backgroundColor: c.color + '22', borderWidth: 2, pointRadius: 0, tension: 0.35, spanGaps: true, fill: true,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#0c0a14', borderColor: '#3a2f5c', borderWidth: 1 } },
      scales: {
        x: { ticks: { color: '#8d84a8', font: { size: 9 } }, grid: { color: '#241c3c' } },
        y: { ticks: { color: '#8d84a8', font: { size: 10 } }, grid: { color: '#241c3c' } },
      }
    }
  });
  if (currentTimeframe === 'live') scrollEl.scrollLeft = scrollEl.scrollWidth;
}

function attachChat(key) {
  chatMsgRef = db.ref('market/chat/' + key + '/messages');
  chatPresenceRef = db.ref('market/chat/' + key + '/presence');
  myPresenceRef = db.ref('market/chat/' + key + '/presence/' + chatGuestId);
  myPresenceRef.set(true);
  myPresenceRef.onDisconnect().remove();
  chatPresenceRef.on('value', snap => {
    const n = snap.numChildren ? snap.numChildren() : 0;
    document.getElementById('chatPresence').textContent = n + ' here';
  });
  chatMsgRef.orderByChild('ts').limitToLast(50).on('value', snap => {
    const msgs = [];
    snap.forEach(ch => msgs.push(ch.val()));
    const el = document.getElementById('chatMessages');
    el.innerHTML = msgs.length ? msgs.map(m => `
      <div class="chat-msg">
        <div class="chat-msg-avatar">💬</div>
        <div class="chat-msg-body"><div class="chat-msg-name">${escapeHtml(m.name || 'Guest')}</div>${escapeHtml(m.text || '')}</div>
      </div>
    `).join('') : '<div class="empty-note">no messages yet — say hi</div>';
    el.scrollTop = el.scrollHeight;
  });
}
function detachChat() {
  if (chatMsgRef) chatMsgRef.off();
  if (chatPresenceRef) chatPresenceRef.off();
  if (myPresenceRef) myPresenceRef.remove();
  chatMsgRef = chatPresenceRef = myPresenceRef = null;
}
function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || !currentAssetCoin) return;
  const name = getChatNickname();
  db.ref('market/chat/' + currentAssetCoin + '/messages').push({ name, text: text.slice(0, 200), ts: Date.now(), day: state.day || 1 });
  input.value = '';
}

function renderLeaderboard() {
  const rows = getTraderRows().sort((a,b) => b.totalProfit - a.totalProfit);
  const medals = ['🥇','🥈','🥉'];
  const el = document.getElementById('leaderboard');
  if (rows.length === 0) { el.innerHTML = '<div class="empty-note">no traders yet</div>'; return; }
  el.innerHTML = rows.map((t,i) => `
    <div class="leader-row">
      <div style="display:flex;align-items:center;gap:8px;">
        <span>${medals[i]||'　'}</span>
        <span style="font-weight:700;font-size:12px;">${t.name}</span>
        <span style="font-size:9.5px;color:#8d84a8;">${t.hasOpen?'active':'flat'}</span>
      </div>
      <span style="font-weight:800;font-size:12.5px;" class="${t.totalProfit>=0?'up':'down'}">${t.totalProfit>=0?'+':''}${fmt(t.totalProfit)}.I</span>
    </div>
  `).join('');
}

function renderPortfolios() {
  const el = document.getElementById('portfolios');
  const rows = getTraderRows();
  if (!rows.length) { el.innerHTML = '<div class="empty-note">no traders yet</div>'; return; }
  el.innerHTML = rows.map(t => {
    const holdings = t.posDetails.length === 0
      ? `<div class="empty-note" style="padding:4px 2px;">no open positions — realized ${t.realizedProfit>=0?'+':''}${fmt(t.realizedProfit)}.I</div>`
      : t.posDetails.map(p => `
        <div class="holding-row">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:14px;">${p.icon}</span>
            <span style="font-size:11px;">${p.coinName}</span>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11.5px;font-weight:700;">${fmt(p.value)}.I</div>
            <div style="font-size:9.5px;" class="${p.pl>=0?'up':'down'}">${p.pl>=0?'+':''}${fmt(p.pl)}.I</div>
          </div>
        </div>
      `).join('');
    return `
      <div style="background:#150f24;border-radius:10px;padding:10px 12px;margin-bottom:10px;border:1px solid #2c2246;">
        <div class="row-between" style="margin-bottom:4px;">
          <span style="font-weight:800;font-size:12.5px;">${t.name}</span>
          <span style="font-weight:800;font-size:11.5px;" class="${t.totalProfit>=0?'up':'down'}">${fmt(t.currentValue)}.I (${t.totalProfit>=0?'+':''}${fmt(t.totalProfit)}.I)</span>
        </div>
        ${holdings}
      </div>
    `;
  }).join('');
}

function renderNews() {
  const el = document.getElementById('newsList');
  if (!el) return;
  if (!state.news.length) { el.innerHTML = '<div class="empty-note">no news yet</div>'; return; }
  el.innerHTML = state.news.slice(0, 15).map(n => `
    <div style="font-size:11px;color:#cfc6e8;padding:7px 2px;border-bottom:1px solid #241c3c;">
      <span class="muted" style="font-size:9.5px;">DAY ${n.day}</span> ${n.text}${n.coinName ? ` <span class="${n.impact>=0?'up':'down'}" style="font-weight:700;">(${n.coinName} ${n.impact>=0?'+':''}${n.impact}%)</span>` : ''}
    </div>
  `).join('');
}

function renderAll() {
  document.getElementById('statusDot').className = 'status-dot ' + (state.online ? 'on' : 'off');
  document.getElementById('statusText').textContent = `SERVER ${state.online ? 'ONLINE' : 'OFFLINE'}`;
  document.getElementById('dayNum').textContent = state.day;
  renderTicker();
  renderNews();
  renderCoinList();
  renderLeaderboard();
  renderPortfolios();
  document.getElementById('updatedNote').textContent = 'live · updated ' + new Date().toLocaleTimeString();
  document.getElementById('syncWarning').style.display = 'none';
}

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (expandedCoin) renderAll(); }, 150);
});

db.ref('market').on('value', (snap) => {
  if (!snap.exists()) { document.getElementById('updatedNote').textContent = 'waiting for market data…'; return; }
  state = migrate(snap.val());
  renderAll();
  if (currentAssetCoin) renderAssetPage();
}, (err) => {
  console.error(err);
  document.getElementById('syncWarning').style.display = 'block';
  document.getElementById('updatedNote').textContent = 'connection error';
});

document.getElementById('assetBackBtn').onclick = closeAssetPage;
document.getElementById('assetFavBtn').onclick = () => toggleFavorite(currentAssetCoin);
document.getElementById('chatSendBtn').onclick = sendChatMessage;
document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChatMessage(); });
document.querySelectorAll('#tfPills .tf-pill').forEach(p => {
  p.onclick = () => {
    currentTimeframe = p.dataset.tf;
    document.querySelectorAll('#tfPills .tf-pill').forEach(x => x.classList.toggle('active', x === p));
    renderAssetChart();
  };
});
</script>
</body>
</html>
